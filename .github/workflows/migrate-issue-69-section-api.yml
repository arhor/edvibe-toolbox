name: Migrate issue 69 section API

on:
  push:
    branches:
      - issue-69-shared-batch-primitives
    paths:
      - .github/workflows/migrate-issue-69-section-api.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-69-shared-batch-primitives
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Route section features through shared Edvibe API
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return updated

          creation_path = Path('src/features/batch-section-creation.js')
          creation = creation_path.read_text()
          creation = creation.replace(
              "const DIALOG_TAG = 'edvibe-toolbox-batch-section-creation-dialog';",
              "import { createFeatureError, parseMarathonId } from '../shared/batch-workflow-primitives.js';\nimport { getLessonById, loadAllMarathonLessons } from '../shared/edvibe-marathon-api.js';\n\nconst DIALOG_TAG = 'edvibe-toolbox-batch-section-creation-dialog';",
              1
          )
          creation = replace_once(
              creation,
              r"\nfunction createFeatureError\(.*?(?=\nfunction normalizeUrl)",
              "",
              'creation shared primitives'
          )
          creation = replace_once(
              creation,
              r"async function loadLessonCatalogue\(.*?(?=async function inspectLessonsSequentially)",
              "async function loadLessonCatalogue({ sendRequest, marathonId, pageSize = 100 }) {\n    const items = await loadAllMarathonLessons({ sendRequest, marathonId, pageSize });\n    return items.map(normalizeLesson);\n}\n\n",
              'creation catalogue'
          )
          creation = replace_once(
              creation,
              r"const structure = await sendRequest\(\s*'LessonWsController',\s*'GetLessonWithId',\s*'Books',\s*\{ LessonId: lesson\.lessonId \}\s*\);",
              "const structure = await getLessonById({ sendRequest, lessonId: lesson.lessonId });",
              'creation lesson read'
          )
          creation_path.write_text(creation)

          deletion_path = Path('src/features/batch-section-deletion.js')
          deletion = deletion_path.read_text()
          deletion = deletion.replace(
              "const DIALOG_TAG = 'edvibe-toolbox-batch-section-deletion-dialog';",
              "import { createFeatureError as featureError, parseMarathonId } from '../shared/batch-workflow-primitives.js';\nimport { getLessonById, loadAllMarathonLessons } from '../shared/edvibe-marathon-api.js';\n\nconst DIALOG_TAG = 'edvibe-toolbox-batch-section-deletion-dialog';",
              1
          )
          deletion = replace_once(
              deletion,
              r"\nfunction featureError\(.*?(?=\nfunction normalizeSectionName)",
              "",
              'deletion shared primitives'
          )
          deletion = replace_once(
              deletion,
              r"async function loadLessonCatalogue\(.*?(?=async function inspectLessonsSequentially)",
              "async function loadLessonCatalogue({ sendRequest, marathonId, pageSize = 100 }) {\n    const items = await loadAllMarathonLessons({ sendRequest, marathonId, pageSize });\n    return items.map(normalizeLesson);\n}\n\n",
              'deletion catalogue'
          )
          deletion = replace_once(
              deletion,
              r"const response = await sendRequest\('LessonWsController', 'GetLessonWithId', 'Books', \{ LessonId: lesson\.lessonId \}\);",
              "const response = await getLessonById({ sendRequest, lessonId: lesson.lessonId });",
              'deletion lesson read'
          )
          deletion_path.write_text(deletion)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Commit verified migration and remove helper
        run: |
          git rm .github/workflows/migrate-issue-69-section-api.yml
          git add src/features/batch-section-creation.js src/features/batch-section-deletion.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Route section reads through Edvibe API boundary"
          git push origin HEAD:issue-69-shared-batch-primitives