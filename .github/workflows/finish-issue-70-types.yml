name: Finish issue 70 type contracts

on:
  push:
    branches:
      - issue-70-typescript-boundaries
    paths:
      - .github/workflows/finish-issue-70-types.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-70-typescript-boundaries
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Preserve pagination behavior while narrowing unknown responses
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/shared/edvibe-marathon-api.js')
          text = path.read_text()
          pattern = re.compile(r"/\*\*\n \* @param \{unknown\} response.*?\n\}\n\n(?=/\*\*\n \* @param \{\{ sendRequest: EdvibeSendRequest, marathonId: number, pageSize\?: number \}\} options)", re.S)
          replacement = '''/**
           * Decode the transport envelope without changing pagination failure semantics.
           * The shared appendPage validator remains authoritative for Items and Count.
           * @param {unknown} response
           * @returns {{ items: unknown, total: unknown }}
           */
          function readPage(response) {
              if (!isRecord(response)) return { items: undefined, total: undefined };
              const value = isRecord(response.Value)
                  ? response.Value
                  : isRecord(response.value)
                      ? response.value
                      : null;
              if (!value) return { items: undefined, total: undefined };
              const page = isRecord(value.Page) ? value.Page : null;
              return {
                  items: value.Items,
                  total: page?.Count
              };
          }

          '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one readPage block, found {count}')
          text = text.replace("readPage(response, 'GetMarathonPupils')", "readPage(response)")
          text = text.replace("readPage(response, 'GetMarathonLessonsForPupilPagination')", "readPage(response)")
          text = text.replace("readPage(response, 'GetMarathonLessonsPagination')", "readPage(response)")

          replacements = {
              "        loadAllPupils(options) {": "        /** @param {{ marathonId: number, pageSize?: number }} options */\n        loadAllPupils(options) {",
              "        loadAllPupilLessons(options) {": "        /** @param {{ marathonId: number, pupilId: number, pageSize?: number }} options */\n        loadAllPupilLessons(options) {",
              "        loadAllMarathonLessons(options) {": "        /** @param {{ marathonId: number, pageSize?: number }} options */\n        loadAllMarathonLessons(options) {",
              "        getLessonById(options) {": "        /** @param {{ lessonId: number }} options */\n        getLessonById(options) {"
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one occurrence of {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Commit verified boundary typing and remove helpers
        run: |
          git rm .github/workflows/finish-issue-70-types.yml .github/workflows/fix-issue-70-types.yml .github/workflows/validate-issue-70-types.yml
          git add src/shared/edvibe-marathon-api.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Validate typed application boundaries"
          git push origin HEAD:issue-70-typescript-boundaries