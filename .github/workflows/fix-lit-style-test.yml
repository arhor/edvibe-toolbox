name: Inspect Lit style test expectation

on:
  push:
    branches:
      - issue-66-lit-styles

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-66-lit-styles
      - name: Show configure references
        run: grep -n -B 3 -A 5 "configure" src/features/batch-user-management.test.js || true
