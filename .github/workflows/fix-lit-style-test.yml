name: Inspect Lit style test expectation

on:
  push:
    branches:
      - issue-66-lit-styles

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-66-lit-styles
      - name: Show failing test
        run: |
          line=$(grep -n "updates an existing dialog" src/features/batch-user-management.test.js | cut -d: -f1)
          end=$((line + 70))
          nl -ba src/features/batch-user-management.test.js | sed -n "${line},${end}p"
