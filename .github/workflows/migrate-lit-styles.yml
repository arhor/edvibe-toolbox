name: Migrate Lit styles

on:
  push:
    branches:
      - issue-66-lit-styles

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-66-lit-styles
      - name: Migrate component styles
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json
          import re
          root = Path('.')
          components = root / 'src' / 'components'
          styles_dir = components / 'styles'
          styles_dir.mkdir(exist_ok=True)
          shared = "import { css } from 'lit';\n\nexport const componentFoundationStyles = css`\n    :host {\n        --edvibe-font-family: \\\"Segoe UI\\\", Inter, Arial, system-ui, sans-serif;\n        --edvibe-dialog-z-index: 2147483647;\n        --edvibe-overlay-background: rgba(15, 23, 42, 0.6);\n        --edvibe-surface: #fff;\n        --edvibe-text: #1f2937;\n        --edvibe-muted-text: #6b7280;\n        --edvibe-border: #d9dfe9;\n        --edvibe-primary: #4055d3;\n        --edvibe-danger: #c93a3a;\n        --edvibe-radius: 14px;\n    }\n\n    button,\n    input,\n    textarea,\n    select {\n        font: inherit;\n    }\n`;\n\nexport const dialogFoundationStyles = css`\n    :host {\n        font-family: var(--edvibe-font-family);\n    }\n`;\n"
          (styles_dir / 'foundations.js').write_text(shared, encoding='utf-8')
          def camel(stem):
              parts = re.split(r'[-_]+', stem)
              return parts[0] + ''.join(part[:1].upper() + part[1:] for part in parts[1:])
          for css_path in sorted(components.glob('*.css')):
              stem = css_path.stem
              export_name = camel(stem) + 'Styles'
              raw_css = css_path.read_text(encoding='utf-8')
              escaped = raw_css.replace('`', '\\`').replace('${', '\\${')
              (components / f'{stem}.styles.js').write_text("import { css } from 'lit';\n\n" + f"export const {export_name} = css`\n{escaped}\n`;\n", encoding='utf-8')
              js_path = components / f'{stem}.js'
              if not js_path.exists():
                  css_path.unlink()
                  continue
              source = js_path.read_text(encoding='utf-8')
              source, count = re.subn(r"(^import\s+\{[^\n]+\}\s+from\s+'lit';\n)", rf"\1import {{ componentFoundationStyles, dialogFoundationStyles }} from './styles/foundations.js';\nimport {{ {export_name} }} from './{stem}.styles.js';\n", source, count=1, flags=re.M)
              if count != 1:
                  raise RuntimeError(f'Could not insert style imports into {js_path}')
              source, count = re.subn(r'(class\s+\w+\s+extends\s+LitElement\s*\{\n)', rf'\1    static styles = [componentFoundationStyles, dialogFoundationStyles, {export_name}];\n\n', source, count=1)
              if count != 1:
                  raise RuntimeError(f'Could not add static styles to {js_path}')
              source = re.sub(r'^\s*stylesheetUrl:\s*\{\s*state:\s*true\s*\},?\s*\n', '', source, flags=re.M)
              source = re.sub(r'^\s*this\.stylesheetUrl\s*=\s*["\']{2};\s*\n', '', source, flags=re.M)
              source = re.sub(r'\n\s*if\s*\(options\.stylesheetUrl\s*!==\s*undefined\)\s*\{\s*\n\s*this\.stylesheetUrl\s*=\s*String\(options\.stylesheetUrl\s*\|\|\s*["\']{2}\);\s*\n\s*\}\s*', '\n', source)
              source = re.sub(r'\s*<link\b(?=[^>]*rel=["\']stylesheet["\'])(?=[^>]*stylesheetUrl)[^>]*>\s*', '\n', source, flags=re.S)
              js_path.write_text(source, encoding='utf-8')
              css_path.unlink()
          creation = components / 'batch-section-creation-dialog.js'
          source = creation.read_text(encoding='utf-8')
          source = source.replace("import { batchSectionCreationDialogStyles } from './batch-section-creation-dialog.styles.js';", "import { batchSectionCreationDialogStyles } from './batch-section-creation-dialog.styles.js';\nimport { batchSectionImageUploadStyles } from './batch-section-image-upload.styles.js';")
          source = source.replace('static styles = [componentFoundationStyles, dialogFoundationStyles, batchSectionCreationDialogStyles];', 'static styles = [componentFoundationStyles, dialogFoundationStyles, batchSectionCreationDialogStyles, batchSectionImageUploadStyles];')
          source = source.replace('        imageStylesheetUrl: {state: true},\n', '')
          source = source.replace("        this.imageStylesheetUrl = '';\n", '')
          source = source.replace('            this.imageStylesheetUrl = resolveEnhancementStylesheet(this.stylesheetUrl);\n', '')
          source = source.replace('    resolveEnhancementStylesheet\n', '')
          source = source.replace('    resolveEnhancementStylesheet,\n', '')
          source = re.sub(r'\s*<link\b(?=[^>]*rel=["\']stylesheet["\'])(?=[^>]*imageStylesheetUrl)[^>]*>\s*', '\n', source, flags=re.S)
          creation.write_text(source, encoding='utf-8')
          image_module = components / 'batch-section-image-upload.js'
          source = image_module.read_text(encoding='utf-8')
          source = re.sub(r'\nfunction resolveEnhancementStylesheet\(stylesheetUrl\) \{.*?\n\}\n', '\n', source, flags=re.S)
          source = source.replace('    resolveEnhancementStylesheet,\n', '')
          image_module.write_text(source, encoding='utf-8')
          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          groups = []
          for group in manifest.get('web_accessible_resources', []):
              kept = [item for item in group.get('resources', []) if not (item.startswith('src/components/') and item.endswith('.css'))]
              if kept:
                  updated = dict(group)
                  updated['resources'] = kept
                  groups.append(updated)
          if groups:
              manifest['web_accessible_resources'] = groups
          else:
              manifest.pop('web_accessible_resources', None)
          manifest_path.write_text(json.dumps(manifest, indent=4) + '\n', encoding='utf-8')
          isolated = root / 'src' / 'isolated.js'
          text = isolated.read_text(encoding='utf-8')
          text = re.sub(r"\['(EDVIBE_TOOLBOX_[A-Z_]+)',\s*'src/components/[^']+\.css',\s*'([^']+)'\]", r"['\1', '\2']", text)
          text = text.replace("window.postMessage({ type: 'EDVIBE_TOOLBOX_START_ALL', stylesheetUrl: chrome.runtime.getURL('src/components/export-progress-dialog.css') }, '*');", "window.postMessage({ type: 'EDVIBE_TOOLBOX_START_ALL' }, '*');")
          text = text.replace('const [type, stylesheet, info] = commands[message.action];', 'const [type, info] = commands[message.action];')
          text = text.replace("window.postMessage({ type, stylesheetUrl: chrome.runtime.getURL(stylesheet) }, '*');", "window.postMessage({ type }, '*');")
          isolated.write_text(text, encoding='utf-8')
          main = root / 'src' / 'main.js'
          text = main.read_text(encoding='utf-8')
          text = re.sub(r"openHistory: \(executionId, sourceStylesheetUrl\) => executionHistoryFeature\.open\(\{\s*stylesheetUrl: new URL\('execution-history-dialog\.css', sourceStylesheetUrl\)\.href,\s*executionId\s*\}\)", "openHistory: (executionId) => executionHistoryFeature.open({ executionId })", text)
          text = text.replace('marathonExportFeature.start({ stylesheetUrl: data.stylesheetUrl });', 'marathonExportFeature.start();')
          for feature in ['lessonResetFeature', 'batchLessonAccessFeature', 'batchUserOnboardingFeature', 'batchUserManagementFeature', 'batchSectionCreationFeature', 'batchSectionDeletionFeature']:
              text = text.replace(f'{feature}.open({{ stylesheetUrl: data.stylesheetUrl }});', f'{feature}.open();')
          text = text.replace("executionHistoryFeature.open({\n            stylesheetUrl: data.stylesheetUrl,\n            executionId: data.executionId || null\n        });", "executionHistoryFeature.open({ executionId: data.executionId || null });")
          text = text.replace('actionRecorderFeature.open({ stylesheetUrl: data.stylesheetUrl });', 'actionRecorderFeature.open();')
          main.write_text(text, encoding='utf-8')
          for path in (root / 'src' / 'features').glob('*.js'):
              source = path.read_text(encoding='utf-8')
              source = re.sub(r'^\s*let stylesheetUrl\s*=\s*["\']{2};\s*\n', '', source, flags=re.M)
              source = re.sub(r'^\s*stylesheetUrl\s*=\s*options\.stylesheetUrl\s*\|\|\s*stylesheetUrl;\s*\n', '', source, flags=re.M)
              source = re.sub(r'^\s*stylesheetUrl:\s*[^,\n]+,?\s*\n', '', source, flags=re.M)
              source = source.replace('panel.configure?.({ stylesheetUrl });', 'panel.configure?.();')
              path.write_text(source, encoding='utf-8')
          agents = root / 'AGENTS.md'
          text = agents.read_text(encoding='utf-8')
          text = text.replace('Component source and CSS files should use matching names and live together under `src/components/`.', 'Lit components own their styles through `static styles`; reusable visual foundations live under `src/components/styles/` and component-specific CSSResult modules stay beside their components.')
          text = text.replace('Keep component styles in dedicated `.css` files so they can be exposed through `web_accessible_resources`.', 'Keep popup page CSS global, but keep in-page Lit component styles inside Lit CSSResult modules rather than runtime-loaded stylesheets.')
          agents.write_text(text, encoding='utf-8')
          PY
          rg -n 'stylesheetUrl|imageStylesheetUrl|resolveEnhancementStylesheet|rel="stylesheet"' src manifest.json > .migration-stylesheet-report.txt || true
          git rm .github/workflows/migrate-lit-styles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate in-page component styles to Lit"
          git push origin HEAD:issue-66-lit-styles
