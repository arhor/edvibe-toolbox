name: Migrate issue 71 runtime layout

on:
  push:
    branches:
      - issue-71-runtime-layout
    paths:
      - .github/workflows/migrate-issue-71-runtime-layout.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-71-runtime-layout
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Move runtime implementation under src/runtime
        run: |
          mkdir -p src/runtime
          git mv popup.js src/runtime/popup.js
          git mv popup.css src/runtime/popup.css
          git mv src/isolated.js src/runtime/isolated.js
          git mv src/main.js src/runtime/main.js
          python - <<'PY'
          from pathlib import Path

          def update(path_name, pairs):
              path = Path(path_name)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'{path}: missing {old!r}')
                  text = text.replace(old, new)
              path.write_text(text)

          update('src/runtime/popup.js', [
              ("from './src/shared/logger.js'", "from '../shared/logger.js'"),
              ("from './src/shared/message-protocol.js'", "from '../shared/message-protocol.js'")
          ])
          update('src/runtime/isolated.js', [
              ("from './shared/logger.js'", "from '../shared/logger.js'"),
              ("from './shared/message-protocol.js'", "from '../shared/message-protocol.js'")
          ])
          update('src/runtime/main.js', [
              ("from './shared/", "from '../shared/"),
              ("from './components/", "from '../components/"),
              ("from './features/", "from '../features/")
          ])
          update('src/entrypoints/popup.js', [("import '../../popup.js';", "import '../runtime/popup.js';")])
          update('src/entrypoints/isolated.js', [("import '../isolated.js';", "import '../runtime/isolated.js';")])
          update('src/entrypoints/main.js', [("import '../main.js';", "import '../runtime/main.js';")])
          update('popup.html', [('href="popup.css"', 'href="src/runtime/popup.css"')])

          update('src/build-foundation.test.js', [
              ("'../../popup.js'", "'../runtime/popup.js'"),
              ("'../isolated.js'", "'../runtime/isolated.js'"),
              ("read('popup.js')", "read('src/runtime/popup.js')"),
              ("read('src/isolated.js')", "read('src/runtime/isolated.js')"),
              (r"\.\/src\/shared\/logger\.js", r"\.\.\/shared\/logger\.js"),
              (r"\.\/shared\/logger\.js", r"\.\.\/shared\/logger\.js")
          ])

          update('src/isolated.test.js', [
              ("require('./isolated.js')", "require('./runtime/isolated.js')")
          ])

          update('src/module-architecture.test.js', [
              (r"\.\.\/main\.js", r"\.\.\/runtime\/main\.js"),
              ("read('src/main.js')", "read('src/runtime/main.js')"),
              ("'popup.js'", "'src/runtime/popup.js'"),
              ("'src/main.js'", "'src/runtime/main.js'"),
              ("read('src/isolated.js')", "read('src/runtime/isolated.js')"),
              (r"\.\/features\/marathon-export\.js", r"\.\.\/features\/marathon-export\.js"),
              (r"\.\/shared\/websocket-transport\.js", r"\.\.\/shared\/websocket-transport\.js"),
              (r"\.\/shared\/message-protocol\.js", r"\.\.\/shared\/message-protocol\.js")
          ])

          update('src/execution-history-wiring.test.js', [
              ("read('src/main.js')", "read('src/runtime/main.js')"),
              ("read('popup.js')", "read('src/runtime/popup.js')"),
              ("read('src/isolated.js')", "read('src/runtime/isolated.js')"),
              (r"\.\.\/main\.js", r"\.\.\/runtime\/main\.js"),
              ("'./shared/", "'../shared/"),
              ("'./components/", "'../components/"),
              ("'./features/", "'../features/")
          ])

          update('src/features/batch-section-creation.integration.test.js', [
              ("path.join(root, 'popup.js')", "path.join(root, 'src/runtime/popup.js')"),
              ("path.join(root, 'src/isolated.js')", "path.join(root, 'src/runtime/isolated.js')"),
              ("path.join(root, 'src/main.js')", "path.join(root, 'src/runtime/main.js')"),
              (r"\.\.\/main\.js", r"\.\.\/runtime\/main\.js"),
              (r"\.\/components\/batch-section-creation-dialog\.js", r"\.\.\/components\/batch-section-creation-dialog\.js"),
              (r"\.\/features\/batch-section-creation\.js", r"\.\.\/features\/batch-section-creation\.js")
          ])

          update('src/features/batch-section-image-upload.integration.test.js', [
              ("path.join(root, 'src/main.js')", "path.join(root, 'src/runtime/main.js')"),
              (r"\.\.\/main\.js", r"\.\.\/runtime\/main\.js"),
              (r"\.\/features\/batch-section-image-upload\.js", r"\.\.\/features\/batch-section-image-upload\.js")
          ])

          update('src/popup-handlers.test.js', [
              ("path.join(projectRoot, 'popup.js')", "path.join(projectRoot, 'src/runtime/popup.js')"),
              ("path.join(projectRoot, 'popup.css')", "path.join(projectRoot, 'src/runtime/popup.css')"),
              ("path.join(projectRoot, 'src/isolated.js')", "path.join(projectRoot, 'src/runtime/isolated.js')"),
              (r"\.\/src\/shared\/message-protocol\.js", r"\.\.\/shared\/message-protocol\.js"),
              (r"\.\/shared\/message-protocol\.js", r"\.\.\/shared\/message-protocol\.js"),
              (r'href="popup\.css"', r'href="src\/runtime\/popup\.css"'),
              (r"\.\.\/\.\.\/popup\.js", r"\.\.\/runtime\/popup\.js")
          ])

          agents = Path('AGENTS.md')
          text = agents.read_text()
          text = text.replace(
              '- `src/entrypoints/`: explicit Vite/CRXJS runtime entry points and package-runtime bridges.',
              '- `src/entrypoints/`: small Vite/CRXJS composition roots for popup, ISOLATED, and MAIN runtimes.\n- `src/runtime/`: runtime coordinators and popup-owned global presentation; application runtime code belongs here rather than at repository root.'
          )
          text = text.replace('`src/main.js`', '`src/runtime/main.js`')
          text = text.replace('`src/isolated.js`', '`src/runtime/isolated.js`')
          text = text.replace('`popup.js`', '`src/runtime/popup.js`')
          text = text.replace('`popup.css`', '`src/runtime/popup.css`')
          agents.write_text(text)

          skill = Path('.agents/skills/preserving-edvibe-manifest-scripts/SKILL.md')
          text = skill.read_text()
          text = text.replace(
              'The entry points own dependency evaluation order. `src/entrypoints/main.js` must initialize package-managed runtime dependencies and shared infrastructure before components and features, then import `src/main.js` last. The isolated entry point must initialize shared isolated-world dependencies before `src/isolated.js`.',
              'Keep entry points as small composition roots. `src/entrypoints/main.js` registers components that must exist before the MAIN coordinator and imports `src/runtime/main.js` last. The isolated and popup entry points import their runtime coordinators from `src/runtime/` after any entrypoint-owned registrations.'
          )
          old_example = """// src/entrypoints/main.js
          import './runtime-dependencies.js';
          import '../shared/logger.js';
          // shared infrastructure, components, and features
          import '../main.js';"""
          new_example = """// src/entrypoints/main.js
          import '../components/export-progress-dialog.js';
          import '../components/reset-lessons-dialog.js';
          import '../runtime/main.js';"""
          text = text.replace(old_example, new_example)
          text = text.replace('Load a coordinator before the modules it coordinates', 'Load a runtime coordinator before entrypoint-owned registrations it depends on')
          skill.write_text(text)
          PY
      - name: Reject stale active runtime paths
        run: |
          if grep -R -n --exclude-dir=dist --exclude-dir=.git --exclude-dir=docs -E "(['\"]popup\.js['\"]|['\"]popup\.css['\"]|['\"]src/(main|isolated)\.js['\"]|require\(['\"]\./isolated\.js['\"]\))" src popup.html manifest.json vite.config.mjs AGENTS.md .agents; then
            echo 'Found stale active runtime path references'
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - name: Run Node tests with useful failure output
        run: |
          set +e
          npm test > /tmp/test-output.txt 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -n -B 8 -A 20 -E 'not ok|AssertionError|ERR_ASSERTION|ENOENT|Error:' /tmp/test-output.txt || true
            tail -n 120 /tmp/test-output.txt
            exit "$status"
          fi
          cat /tmp/test-output.txt
      - run: npm run build
      - name: Commit verified layout and remove helper
        run: |
          git rm .github/workflows/migrate-issue-71-runtime-layout.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Simplify runtime source layout"
          git push origin HEAD:issue-71-runtime-layout