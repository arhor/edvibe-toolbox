name: Run Lit style migration

on:
  push:
    branches:
      - issue-66-lit-styles

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-66-lit-styles
      - name: Apply migration
        run: python scripts/migrate-lit-styles-once.py
      - name: Commit migrated sources
        run: |
          git rm .github/workflows/run-lit-style-migration.yml scripts/migrate-lit-styles-once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate in-page component styles to Lit"
          git push origin HEAD:issue-66-lit-styles
