name: Fix issue 66 test contract

on:
  push:
    branches:
      - issue-66-lit-styles
    paths:
      - .github/workflows/fix-issue-66-test-contract.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-66-lit-styles
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Update the stale configure assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/batch-lesson-access.test.js')
          text = path.read_text()
          old = """assert.deepEqual(findDialogCalls(dialog, 'configure')[0].args, [{
                  }]);"""
          new = "assert.deepEqual(findDialogCalls(dialog, 'configure')[0].args, []);"
          if old not in text:
              raise SystemExit('Expected configure assertion was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm test
      - name: Commit the verified test cleanup and remove temporary workflows
        run: |
          git rm -f .github/workflows/fix-issue-66-test-contract.yml .github/workflows/diagnose-tests.yml
          git add src/features/batch-lesson-access.test.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update tests for bundled Lit styles"
          git push origin HEAD:issue-66-lit-styles