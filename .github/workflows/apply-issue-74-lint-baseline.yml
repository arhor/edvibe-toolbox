name: Apply issue 74 lint baseline

on:
  push:
    branches:
      - issue-74-eslint-quality-gate
    paths:
      - .github/workflows/apply-issue-74-lint-baseline.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-74-eslint-quality-gate
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply lint baseline cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path_name, old, new, expected=1):
              path = Path(path_name)
              text = path.read_text()
              if text.count(old) != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {text.count(old)}')
              path.write_text(text.replace(old, new, expected))

          replace('src/components/action-recorder-dialog.js', "import { LitElement, html, nothing } from 'lit';", "import { LitElement, html } from 'lit';")
          replace('src/components/batch-user-management-dialog.js', "import { LitElement, html, nothing } from 'lit';", "import { LitElement, html } from 'lit';")
          replace('src/components/batch-user-management-dialog.js', "    configure(options = {}) {\n        options = options && typeof options === 'object' ? options : {};\nreturn this;\n    }", "    configure() {\n        return this;\n    }")

          p = Path('src/components/export-progress-dialog.js')
          text = p.read_text()
          text, count = re.subn(
              r"    update\(options = new Map\(\)\) \{.*?\n    \}\n\n    syncHostState\(\)",
              """    setProgress(options = {}) {
              options = options && typeof options === 'object' ? options : {};
              const { statusText = '', loadedSections = 0, totalSections = 0, countText, state = 'loading' } = options;
              this.statusText = String(statusText || '');
              this.loadedSections = Number(loadedSections) || 0;
              this.totalSections = Number(totalSections) || 0;
              this.countText = countText;
              this.progressState = String(state || 'loading');
              this.syncHostState();
              return this;
          }

          syncHostState()""",
              text, count=1, flags=re.S)
          if count != 1: raise SystemExit(f'expected one export update block, found {count}')
          p.write_text(text.replace('return this.update({', 'return this.setProgress({'))

          p = Path('src/features/marathon-export.js'); text = p.read_text(); p.write_text(text.replace('progressOverlay.update(', 'progressOverlay.setProgress('))
          p = Path('src/component-tests/export-progress-dialog-tests.js'); text = p.read_text(); p.write_text(text.replace('dialog.update(', 'dialog.setProgress('))
          p = Path('src/components/export-progress-dialog.test.js'); text = p.read_text(); p.write_text(text.replace(r"/update\(options = new Map\(\)\)/", r"/setProgress\(options = \{\}\)/", 1))
          p = Path('src/features/marathon-export.test.js'); text = p.read_text(); text = text.replace('        update(detail) {', '        setProgress(detail) {', 1); text = text.replace("calls.push(['update', detail]);", "calls.push(['setProgress', detail]);", 1); p.write_text(text)

          replace('src/features/batch-lesson-access-history.test.js', 'sendRequest: async (controller, method, projectName, value) => {', 'sendRequest: async (controller, method, _projectName, _value) => {')
          replace('src/features/batch-section-creation-history-model.test.js', "const { sectionDefinition, lessons, plan, build } = require('./batch-section-creation-history-test-fixtures.js');", "const { sectionDefinition, lessons, build } = require('./batch-section-creation-history-test-fixtures.js');")

          p = Path('src/features/reset-lessons.js')
          lines = p.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if 'exercise ${exercise.id}: ${error.message}`' in line]
          if len(matches) != 1: raise SystemExit(f'expected one wrapped reset exercise message, found {len(matches)}')
          i = matches[0]
          lines[i] = lines[i] + ','
          lines.insert(i + 1, '                    { cause: error }')
          p.write_text('\n'.join(lines) + '\n')

          p = Path('src/features/reset-lessons.test.js'); text = p.read_text()
          text, count1 = re.subn(r"\nfunction createModalTestDocument\(\) \{.*?\n\}\n\n(?=test\('parseMarathonId)", '\n', text, count=1, flags=re.S)
          text, count2 = re.subn(r"\n// These cases exercised the former feature-level modal controller\..*?\n\}\)\(test\.skip\);\n", '\n', text, count=1, flags=re.S)
          if (count1, count2) != (1, 1): raise SystemExit(f'obsolete reset test cleanup counts: {(count1, count2)}')
          p.write_text(text)

          p = Path('src/runtime/popup.js'); text = p.read_text(); text = text.replace("import { createLoggerFactory } from '../shared/logger.js';\n", ''); text = text.replace("const createPopupLog = createLoggerFactory('POPUP');\nconst log = createPopupLog();\n\n", ''); p.write_text(text)
          PY
      - name: Lint
        run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - name: Commit cleanup and remove temporary workflows
        run: |
          git rm .github/workflows/apply-issue-74-lint-baseline.yml .github/workflows/finish-issue-74-lint-baseline.yml .github/workflows/fix-issue-74-lint-baseline.yml .github/workflows/bootstrap-issue-74-eslint.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Establish zero-error ESLint baseline"
          git push origin HEAD:issue-74-eslint-quality-gate