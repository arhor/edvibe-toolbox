name: Issue 25 bootstrap validation

on:
  push:
    branches:
      - issue-25-crxjs-vite-foundation

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies from generated lock
        run: npm ci
      - name: Run existing tests
        run: npm run test:ci
      - name: Build extension
        run: npm run build
      - name: Validate generated extension structure
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const manifest = JSON.parse(fs.readFileSync('dist/manifest.json', 'utf8'));
          const isolated = manifest.content_scripts.find((entry) => entry.world === 'ISOLATED');
          const main = manifest.content_scripts.find((entry) => entry.world === 'MAIN');

          assert.equal(manifest.manifest_version, 3);
          assert.equal(manifest.action.default_popup, 'popup.html');
          assert.equal(isolated.run_at, 'document_start');
          assert.equal(main.run_at, 'document_start');
          assert.deepEqual(isolated.js, ['build/isolated-logger.js', 'src/isolated.js']);
          assert.ok(main.js.length > 2);
          assert.equal(main.js[0], 'lib/jszip.min.js');
          assert.equal(main.js[1], 'lib/turndown.min.js');
          assert.equal(main.js[2], 'src/shared/logger.js');
          assert.equal(main.js.at(-1), 'src/main.js');

          for (const entry of manifest.content_scripts) {
            for (const file of entry.js || []) {
              assert.ok(!file.includes('-loader.js'), `${file} must execute directly`);
              assert.ok(fs.existsSync(path.join('dist', file)), `${file} must be emitted`);
            }
          }

          for (const file of ['popup.html', 'popup.js', 'src/components/popup-tool-list.js']) {
            assert.ok(fs.existsSync(path.join('dist', file)), `${file} must be emitted`);
          }

          for (const resource of manifest.web_accessible_resources || []) {
            for (const file of resource.resources || []) {
              if (file.includes('*')) continue;
              assert.ok(fs.existsSync(path.join('dist', file)), `${file} must be emitted`);
            }
          }
          NODE
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock CRXJS and Vite dependencies"
          git push
