name: Repair test paths

on:
  push:
    branches:
      - fix-67-test-paths

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix-67-test-paths

      - name: Correct colocated test module paths
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s#require('../src/features/batch-lesson-access.js')#require('./batch-lesson-access.js')#" src/features/batch-lesson-access.test.js
          sed -i "s#require('../src/features/batch-section-creation.js')#require('./batch-section-creation.js')#" src/features/batch-section-creation.test.js
          sed -i "s#require('../src/features/batch-section-deletion.js')#require('./batch-section-deletion.js')#" src/features/batch-section-deletion.test.js
          sed -i "s#require('../src/features/batch-user-management')#require('./batch-user-management.js')#" src/features/batch-user-management.test.js
          sed -i "s#require('../src/features/marathon-export.js')#require('./marathon-export.js')#" src/features/marathon-export.test.js
          sed -i "s#require('../src/features/reset-lessons.js')#require('./reset-lessons.js')#" src/features/reset-lessons.test.js
          sed -i "s#require('../src/shared/websocket-transport.js')#require('./websocket-transport.js')#" src/shared/websocket-transport.test.js
          git rm .github/workflows/repair-test-paths.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features src/shared
          git commit -m "Fix remaining colocated test module paths"
          git push origin HEAD:fix-67-test-paths
