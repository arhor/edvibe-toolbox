name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Emit refreshed dependency lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          echo 'LOCKFILE_BASE64_BEGIN'
          base64 -w0 package-lock.json
          echo
          echo 'LOCKFILE_BASE64_END'
