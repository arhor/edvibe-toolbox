name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        shell: bash
        run: |
          set +e
          output="$(npm run test:ci 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$output" \
              | grep -E 'not ok|AssertionError|error:|expected:|actual:|operator:|stack:|code:' \
              | head -n 60 \
              | while IFS= read -r line; do
                  echo "::error::$line"
                done
          fi
          exit "$status"