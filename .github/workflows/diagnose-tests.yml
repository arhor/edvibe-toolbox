name: Diagnose tests

on:
  push:
    branches:
      - issue-66-lit-styles

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-66-lit-styles
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Capture failing tests
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          status=$?
          echo "TEST_EXIT=$status"
          echo "===== FAILURES ====="
          grep -n -B 12 -A 24 -E 'not ok|AssertionError|ERR_ASSERTION|Error:' test-output.txt || true
          echo "===== TAIL ====="
          tail -n 120 test-output.txt
          exit 0
