name: Migrate issue 69 shared primitives

on:
  push:
    branches:
      - issue-69-shared-batch-primitives
    paths:
      - .github/workflows/migrate-issue-69-shared-primitives.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-69-shared-batch-primitives
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Replace duplicated workflow and API implementations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return updated

          access_path = Path('src/features/batch-lesson-access.js')
          access = access_path.read_text()
          access = replace_once(
              access,
              r"^const EMAIL_PATTERN = .*?\nconst OPERATIONAL_WRITE_CODES",
              "import {\n    TRANSIENT_CODES,\n    appendPage,\n    createFeatureError,\n    parseEmailInput,\n    parseMarathonId,\n    runWithRetry\n} from '../shared/batch-workflow-primitives.js';\nimport { loadAllPupilLessons, loadAllPupils } from '../shared/edvibe-marathon-api.js';\n\nconst OPERATIONAL_WRITE_CODES",
              'access imports'
          )
          access = replace_once(access, r"\nfunction createFeatureError\(.*?(?=\nfunction getPupilId)", "", 'access feature error')
          access = replace_once(access, r"\nfunction isTransientError\(.*?(?=\nfunction resolvePupilsByEmail)", "", 'access shared helper block')
          access_path.write_text(access)

          management_path = Path('src/features/batch-user-management.js')
          management = management_path.read_text()
          management = replace_once(
              management,
              r"^const EMAIL_PATTERN = .*?\nconst USER_MANAGEMENT_DIALOG_TAG",
              "import {\n    appendPage,\n    createFeatureError,\n    parseEmailInput as parseSharedEmailInput,\n    parseMarathonId,\n    runWithRetry\n} from '../shared/batch-workflow-primitives.js';\nimport { loadAllPupils } from '../shared/edvibe-marathon-api.js';\n\nconst USER_MANAGEMENT_DIALOG_TAG",
              'management imports'
          )
          management = replace_once(management, r"\nfunction createFeatureError\(.*?(?=\nfunction parseMarathonId)", "", 'management feature error')
          management = replace_once(
              management,
              r"\nfunction parseMarathonId\(.*?(?=\nfunction resolveUsersByEmail)",
              "\nfunction parseEmailInput(value) {\n    return parseSharedEmailInput(value, { includeItems: true });\n}\n",
              'management shared helper block'
          )
          management = replace_once(management, r"\nfunction isTransientError\(.*?(?=\nfunction cloneUserRow)", "", 'management retry block')
          management_path.write_text(management)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Commit verified migration and remove helper
        run: |
          git rm .github/workflows/migrate-issue-69-shared-primitives.yml
          git add src/features/batch-lesson-access.js src/features/batch-user-management.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reuse shared batch workflow primitives"
          git push origin HEAD:issue-69-shared-batch-primitives