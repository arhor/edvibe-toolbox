name: Fix issue 74 lint baseline

on:
  push:
    branches:
      - issue-74-eslint-quality-gate
    paths:
      - .github/workflows/fix-issue-74-lint-baseline.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-74-eslint-quality-gate
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Clean existing lint debt without suppressions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path_name, old, new, count=None):
              path = Path(path_name)
              text = path.read_text()
              actual = text.count(old)
              expected = count if count is not None else 1
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {actual}')
              path.write_text(text.replace(old, new, expected))

          replace(
              'src/components/action-recorder-dialog.js',
              "import { LitElement, html, nothing } from 'lit';",
              "import { LitElement, html } from 'lit';"
          )
          replace(
              'src/components/batch-user-management-dialog.js',
              "import { LitElement, html, nothing } from 'lit';",
              "import { LitElement, html } from 'lit';"
          )
          replace(
              'src/components/batch-user-management-dialog.js',
              "    configure(options = {}) {\n        options = options && typeof options === 'object' ? options : {};\nreturn this;\n    }",
              "    configure() {\n        return this;\n    }"
          )

          component = Path('src/components/export-progress-dialog.js')
          text = component.read_text()
          pattern = re.compile(r"    update\(options = new Map\(\)\) \{.*?\n    \}\n\n    syncHostState\(\)", re.S)
          replacement = """    setProgress(options = {}) {
              options = options && typeof options === 'object' ? options : {};
              const {
                  statusText = '',
                  loadedSections = 0,
                  totalSections = 0,
                  countText,
                  state = 'loading'
              } = options;

              this.statusText = String(statusText || '');
              this.loadedSections = Number(loadedSections) || 0;
              this.totalSections = Number(totalSections) || 0;
              this.countText = countText;
              this.progressState = String(state || 'loading');
              this.syncHostState();
              return this;
          }

          syncHostState()"""
          text, changed = pattern.subn(replacement, text, count=1)
          if changed != 1:
              raise SystemExit(f'export-progress-dialog: expected one update lifecycle block, found {changed}')
          text = text.replace('return this.update({', 'return this.setProgress({')
          component.write_text(text)

          export_feature = Path('src/features/marathon-export.js')
          text = export_feature.read_text()
          occurrences = text.count('progressOverlay.update(')
          if occurrences < 1:
              raise SystemExit('Expected progressOverlay.update calls')
          export_feature.write_text(text.replace('progressOverlay.update(', 'progressOverlay.setProgress('))

          export_browser = Path('src/component-tests/export-progress-dialog-tests.js')
          text = export_browser.read_text()
          if text.count('dialog.update(') != 2:
              raise SystemExit('Expected two browser dialog.update calls')
          export_browser.write_text(text.replace('dialog.update(', 'dialog.setProgress('))

          export_contract = Path('src/components/export-progress-dialog.test.js')
          text = export_contract.read_text()
          text = text.replace(
              r"/update\(options = new Map\(\)\)/",
              r"/setProgress\(options = \{\}\)/"
          )
          export_contract.write_text(text)

          export_test = Path('src/features/marathon-export.test.js')
          text = export_test.read_text()
          if text.count('        update(detail) {') != 1:
              raise SystemExit('Expected one export overlay spy update method')
          text = text.replace('        update(detail) {', '        setProgress(detail) {')
          text = text.replace("calls.push(['update', detail]);", "calls.push(['setProgress', detail]);")
          export_test.write_text(text)

          replace(
              'src/features/batch-lesson-access-history.test.js',
              'sendRequest: async (controller, method, projectName, value) => {',
              'sendRequest: async (controller, method, _projectName, _value) => {'
          )
          replace(
              'src/features/batch-section-creation-history-model.test.js',
              'const { sectionDefinition, lessons, plan, build } = require(\'./batch-section-creation-history-test-fixtures.js\');',
              'const { sectionDefinition, lessons, build } = require(\'./batch-section-creation-history-test-fixtures.js\');'
          )

          reset_feature = Path('src/features/reset-lessons.js')
          text = reset_feature.read_text()
          old = """                throw new Error(
                    `Failed in \"${item.lesson.Name}\", `
                    + `exercise ${exercise.id}: ${error.message}`
                );"""
          new = """                throw new Error(
                    `Failed in \"${item.lesson.Name}\", `
                    + `exercise ${exercise.id}: ${error.message}`,
                    { cause: error }
                );"""
          if text.count(old) != 1:
              raise SystemExit('Expected one reset wrapped error')
          reset_feature.write_text(text.replace(old, new))

          reset_test = Path('src/features/reset-lessons.test.js')
          text = reset_test.read_text()
          text, fake_count = re.subn(
              r"\nfunction createModalTestDocument\(\) \{.*?\n\}\n\n(?=test\('parseMarathonId)",
              '\n',
              text,
              count=1,
              flags=re.S
          )
          if fake_count != 1:
              raise SystemExit(f'Expected one obsolete fake document helper, found {fake_count}')
          text, skipped_count = re.subn(
              r"\n// These cases exercised the former feature-level modal controller\..*?\n\}\)\(test\.skip\);\n",
              '\n',
              text,
              count=1,
              flags=re.S
          )
          if skipped_count != 1:
              raise SystemExit(f'Expected one obsolete skipped modal block, found {skipped_count}')
          reset_test.write_text(text)

          popup = Path('src/runtime/popup.js')
          text = popup.read_text()
          text = text.replace("import { createLoggerFactory } from '../shared/logger.js';\n", '')
          text = text.replace("const createPopupLog = createLoggerFactory('POPUP');\nconst log = createPopupLog();\n\n", '')
          popup.write_text(text)
          PY
      - name: Run lint with diagnostics
        run: |
          set +e
          npm run lint > /tmp/lint-output.txt 2>&1
          status=$?
          cat /tmp/lint-output.txt
          exit "$status"
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - name: Commit verified lint baseline and remove helpers
        run: |
          git rm .github/workflows/fix-issue-74-lint-baseline.yml .github/workflows/bootstrap-issue-74-eslint.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Establish zero-error ESLint baseline"
          git push origin HEAD:issue-74-eslint-quality-gate