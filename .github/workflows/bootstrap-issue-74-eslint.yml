name: Bootstrap issue 74 ESLint

on:
  push:
    branches:
      - issue-74-eslint-quality-gate
    paths:
      - .github/workflows/bootstrap-issue-74-eslint.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-74-eslint-quality-gate
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin lint dependencies
        run: npm install --save-dev --save-exact eslint@latest @eslint/js@latest typescript-eslint@latest globals@latest eslint-plugin-lit@latest eslint-plugin-wc@latest
      - name: Commit dependency lock
        run: |
          git add package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Add ESLint quality dependencies"
            git push origin HEAD:issue-74-eslint-quality-gate
          fi
      - name: Run lint with diagnostics
        run: |
          set +e
          npm run lint > /tmp/lint-output.txt 2>&1
          status=$?
          cat /tmp/lint-output.txt
          exit "$status"
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - name: Remove bootstrap helper
        run: |
          git rm .github/workflows/bootstrap-issue-74-eslint.yml
          git commit -m "Remove temporary ESLint bootstrap workflow"
          git push origin HEAD:issue-74-eslint-quality-gate