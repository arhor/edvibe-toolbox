name: Run Lit style cleanup

on:
  push:
    branches:
      - issue-66-lit-styles

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-66-lit-styles
      - name: Remove obsolete stylesheet plumbing
        run: python scripts/cleanup-lit-style-plumbing-once.py
      - name: Commit cleanup
        run: |
          git rm .github/workflows/run-lit-style-cleanup.yml scripts/cleanup-lit-style-plumbing-once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove runtime stylesheet URL plumbing"
          git push origin HEAD:issue-66-lit-styles
